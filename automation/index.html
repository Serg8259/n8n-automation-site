<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Автоматизация — SVPROF</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f8fafc;
            color: #0f172a;
            line-height: 1.6;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        h1, h2 {
            margin-bottom: 20px;
        }

        /* ===== WORKFLOW IMAGE BLOCK ===== */
        .workflow-figure {
            margin: 60px auto;
            text-align: center;
            max-width: 1000px;
        }

        .workflow-figure img {
            width: 100%;
            border-radius: 14px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.12);
        }

        .workflow-figure figcaption {
            font-size: 20px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 18px;
            color: #0f172a;
        }
        /* ================================= */
    </style>
</head>

<body>

<div class="container">
    <h1>Автоматизация бизнес‑процессов</h1>
    <p>Мы внедряем умные системы автоматизации, которые снимают рутину, ускоряют процессы и делают бизнес управляемым через данные.</p>

    <!-- WORKFLOW BLOCK -->
    <figure class="workflow-figure">
        <figcaption>
            Рабочий workflow автоматизированного Telegram-бота этого сайта
        </figcaption>

        <img src="Workflow_Bot_1.png" alt="Рабочий workflow Telegram-бота">
    </figure>

    <section class="cta" id="cta">
        <h2>Начните с экспресс-аудита</h2>
        <p>Мы бесплатно оценим потенциал автоматизации вашей компании и покажем, где теряются деньги и время.</p>
    </section>
</div>

</body>
</html>
